  - { id: implement, kind: agent, ref: agents/development-agent, ui: { label: Implementing } }
  - { id: test, kind: agent, ref: agents/qa-agent, ui: { label: Testing } }
  - { id: review, kind: agent, ref: agents/code-reviewer, ui: { label: Reviewing } }
